[project]
name = "geo-tagger"
version = "0.1.0"
description = "Local web app for geotagging photo/video libraries via a map UI, with face detection and offline reverse geocoding."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dan Watt" },
]
keywords = ["geotagging", "exif", "xmp", "photos", "geocoding", "faces"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.132",
    "uvicorn[standard]",
    "pyexiftool",
    "pillow",
    "pillow-heif",
    "av",
    "insightface>=1.0.1",
    # GPU build; the extras pull CUDA 12 + cuDNN in as pip wheels, so no system
    # CUDA install is needed. Same `onnxruntime` module as the CPU package, and it
    # still runs on CPU when CUDA can't load. No macOS GPU wheels, so CPU build there.
    "onnxruntime-gpu[cuda,cudnn]>=1.27.0; sys_platform != 'darwin'",
    "onnxruntime>=1.27.0; sys_platform == 'darwin'",
    "rawpy>=0.27.0",
    "osmium>=4.3.1",
    "pyshp>=2.3.1",
    "tokenizers>=0.23.3",
]

[project.urls]
Repository = "https://github.com/danwatt/geo-tagger"

[project.scripts]
geotagger = "geotagger.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotagger"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
# insightface depends on the CPU `onnxruntime` package, which installs the same
# module as onnxruntime-gpu and would clobber it. Override it so it's only ever
# installed on macOS, where it's the build we want; elsewhere only the GPU build lands.
override-dependencies = ["onnxruntime>=1.27.0; sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/geotagger"]
omit = [
    "*/geotagger/__main__.py",
    "*/geotagger/web/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Bug-catching only, no style rules (and no `ruff format`): pyflakes (unused /
# undefined names, redefinitions, unused locals), E9 (syntax errors), and
# flake8-bugbear minus the rules that fire on deliberate patterns here.
select = ["F", "E9", "B"]
ignore = [
    "B008",  # FastAPI's `body: Model = Model()` / Depends() defaults are idiomatic
    "B904",  # `raise HTTPException(...)` inside except is the house error-handling style
    "B905",  # zip(strict=) on every call would be churn; lengths are equal by construction
    "B007",  # unused loop variables are harmless and often document tuple shape
]
