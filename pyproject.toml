[project]
name = "geo-tagger"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyexiftool",
    "pillow",
    "pillow-heif",
    "av",
]

[project.scripts]
geotagger = "geotagger.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotagger"]
