[project]
name = "geo-tagger"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyexiftool",
    "pillow",
    "pillow-heif",
    "av",
    "insightface>=1.0.1",
    "onnxruntime>=1.27.0",
]

[project.scripts]
geotagger = "geotagger.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotagger"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/geotagger"]
omit = [
    "*/geotagger/__main__.py",
    "*/geotagger/web/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
