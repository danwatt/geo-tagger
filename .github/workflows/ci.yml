name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (bug-finding rules only, see [tool.ruff] in pyproject.toml)
        run: uv run ruff check src tests scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types match the committed schema
        # openapi.json itself is checked against the routes by pytest
        # (tests/test_frontend_contract.py); this checks schema.d.ts against it.
        run: |
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tz: [""]
        include:
          # Runners default to UTC, which hides local-time bugs (a UTC run
          # passes code that confuses wall clock with UTC). West of UTC is the
          # direction the past date-bucketing bugs went. Linux only: the Windows
          # CRT does not understand IANA zone names in TZ.
          - os: ubuntu-latest
            tz: America/Los_Angeles
    name: test (${{ matrix.os }}${{ matrix.tz && format(', TZ={0}', matrix.tz) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set time zone
        # Only for the TZ entry: the other jobs must not see TZ at all (an empty
        # TZ is still "set" and its meaning varies by libc / CRT).
        if: matrix.tz != ''
        run: |
          echo "TZ=${{ matrix.tz }}" >> "$GITHUB_ENV"
          TZ=${{ matrix.tz }} date

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        # scripts/get_exiftool.py downloads from SourceForge, which serves a
        # bot-check page (or an outright 403) to CI/datacenter IPs. Chocolatey
        # (preinstalled on windows-latest) is CI-reliable and puts exiftool on
        # PATH, which config.get_exiftool_path() already falls back to.
        run: choco install exiftool -y

      - name: Run tests
        # GitHub sets CI=true, so tests/conftest.py's skip_or_fail turns a missing
        # ExifTool into a failure here instead of a silent skip. -rs lists the
        # reasons for the skips that remain (platform-only tests).
        run: uv run pytest -q -rs
