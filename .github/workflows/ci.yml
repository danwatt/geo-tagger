name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        # scripts/get_exiftool.py downloads from SourceForge, which serves a
        # bot-check page (or an outright 403) to CI/datacenter IPs. Chocolatey
        # (preinstalled on windows-latest) is CI-reliable and puts exiftool on
        # PATH, which config.get_exiftool_path() already falls back to.
        run: choco install exiftool -y

      - name: Run tests
        # GitHub sets CI=true, so tests/conftest.py's skip_or_fail turns a missing
        # ExifTool into a failure here instead of a silent skip. -rs lists the
        # reasons for the skips that remain (platform-only tests).
        run: uv run pytest -q -rs
