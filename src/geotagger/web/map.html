<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Places DB - Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="map.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="map"></div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <label title="Show the boundary each place would win when a photo's coordinates resolve to it, once zoomed in far enough">
      <input type="checkbox" id="voronoi-toggle" checked/>
      Place boundaries
    </label>
  </div>
  <div class="toolbar-group">
    <label title="Show real OSM boundaries (cities, parks, stadiums, campuses, neighborhoods, named buildings) that photos are geocoded inside of">
      <input type="checkbox" id="osm-toggle"/>
      OSM places
    </label>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="map-hint"></div>
</div>

<div id="status-bar"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="nav.js"></script>
<script src="map.js"></script>
</body>
</html>
