<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contexts - Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.css"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="contexts.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="contexts"></div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Life Contexts</h2>
      <button id="add-context-btn">+ New</button>
    </div>
    <div id="context-list">
      <div id="no-contexts-hint">No contexts yet — draw a polygon and save one.</div>
    </div>
  </div>
  <div id="map"></div>
</div>

<div id="context-form-panel">
  <h3 id="form-title">New Context</h3>
  <label>
    Name
    <input type="text" id="form-name" placeholder="e.g. City A, childhood"/>
  </label>
  <label>
    Start date (optional)
    <input type="date" id="form-start"/>
  </label>
  <label>
    End date (optional)
    <input type="date" id="form-end"/>
  </label>
  <button id="draw-btn">Draw polygon</button>
  <div id="polygon-status">No polygon drawn</div>
  <div id="form-actions">
    <button id="form-save-btn" disabled>Save</button>
    <button id="form-cancel-btn">Cancel</button>
  </div>
</div>

<div id="status-bar"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.min.js"></script>
<script src="nav.js"></script>
<script src="contexts.js"></script>
</body>
</html>
