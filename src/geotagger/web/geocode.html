<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="roadtrip.css"/>
<link rel="stylesheet" href="location-picker.css"/>
<link rel="stylesheet" href="geocode-location.css"/>
<link rel="stylesheet" href="workspace-layout.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="geocode"></div>
</div>

<div id="workspace-filters">
      <div class="toolbar-group geocode-location-group">
        <label for="geocode-location-input">Location:</label>
        <div class="geocode-location-picker">
          <input id="geocode-location-input" type="text" placeholder="Saved places, cities, counties…" autocomplete="off"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="geocode-location-suggest" aria-describedby="geocode-location-help"/>
          <div id="geocode-location-suggest" class="location-suggestions" role="listbox" hidden></div>
        </div>
        <select id="place-buffer-select" aria-label="Search area" title="Grow the place's bounds outward before filtering photos" hidden>
          <option value="0" selected>Within bounds</option>
          <option value="0.1">+0.1 miles</option>
          <option value="0.25">+0.25 miles</option>
          <option value="0.5">+0.5 miles</option>
          <option value="1">+1 mile</option>
          <option value="2">+2 miles</option>
          <option value="5">+5 miles</option>
          <option value="10">+10 miles</option>
        </select>
        <a class="button" href="/custom-places.html" title="Add or edit custom places">✏️ Edit places</a>
        <span id="geocode-location-help">Choose a location to load photos and nearby untagged candidates.</span>
      </div>
<div class="scope-date-controls">  <div class="toolbar-group">
    <button id="select-month-btn">Select Month</button>
    <span id="selected-month-label">No month selected</span>
  </div>
  <div class="toolbar-group" id="timeline-toolbar-group">
    <button id="timeline-btn" disabled title="Load dated photos to narrow the date range">📊 Date range</button>
    <span id="timeline-range-label"></span>
  </div>
  <div class="toolbar-group">
    <button id="select-area-btn">Select Area</button>
    <label for="window-select">Include untagged within</label>
    <select id="window-select">
      <option value="900">15 min</option>
      <option value="1800">30 min</option>
      <option value="3600">1 hr</option>
      <option value="7200">2 hr</option>
      <option value="43200">12 hr</option>
      <option value="86400">24 hr</option>
      <option value="604800">1 week</option>
    </select>
    <span id="selected-area-label"></span>
  </div>
</div>
</div>
<div class="workspace-scope"><span id="workspace-scope-text">Choose a location or month to begin</span><button id="preview-toggle" aria-expanded="true">Hide preview</button></div>
<!-- Hidden controls kept for JS compatibility -->
<div style="display:none">
  <input id="lat-input" type="text"/>
  <input id="lng-input" type="text"/>
  <button id="apply-latlng-btn"></button>
  <button id="copy-location-btn"></button>
  <button id="remove-geotag-btn"></button>
</div>

<div id="cam-legend"></div>

<div id="main">
  <div id="map-pane">
    <div id="map-nav">
      <div class="toolbar-group imprecise-control-group">
        <label title="Drop photos with a specified uncertainty radius">
          <input type="checkbox" id="imprecise-toggle" />
          Imprecise Drop
        </label>
        <select id="imprecise-radius-select" style="display: none;">
          <option value="160.934">0.1 miles</option>
          <option value="402.336">0.25 miles</option>
          <option value="804.672">0.5 miles</option>
          <option value="1609.34">1 mile</option>
          <option value="8046.72">5 miles</option>
          <option value="16093.44">10 miles</option>
          <option value="40233.6" selected>25 miles</option>
          <option value="80467.2">50 miles</option>
        </select>
      </div>
      <div class="toolbar-group">
        <input id="place-search" type="text" placeholder="Jump to map location…" aria-label="Jump to map location" />
        <button id="place-search-btn">Go</button>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <div id="grid-pane">
    <!-- Sticky header: the filters and the proposal banner ride together, so a
         suggestion raised while scrolled deep into a month stays reachable. -->
    <div id="grid-header">
    <div id="grid-nav">
      <!-- Show filter: four independent toggles, not a dropdown. Each photo falls
           in exactly one of geotagged / not tagged / ignored; Screenshots cuts
           across all three. Wired in app.js's FILTER_TOGGLES. -->
      <div class="toolbar-group filter-toggles" id="filter-toggles">
        <button class="filter-toggle on" data-filter="geotagged" aria-pressed="true"
                title="Show photos that already have a location">📍 Geotagged</button>
        <button class="filter-toggle on" data-filter="untagged" aria-pressed="true"
                title="Show photos still waiting for a location">❓ Not tagged</button>
        <button class="filter-toggle on" data-filter="screenshots" aria-pressed="true"
                title="Show screenshots (.png)">🖼 Screenshots</button>
        <button class="filter-toggle" data-filter="ignored" aria-pressed="false"
                title="Show photos marked as needing no location">🚫 Ignored</button>
      </div>
      <div class="toolbar-group">
        <!-- How finely each day's thumbnails are split into rows. Wired in
             app.js's timeBands; the choice is remembered per browser. -->
        <select id="band-select" title="Split each day's photos into rows by time taken">
          <option value="0">Rows: whole day</option>
          <option value="300">Rows: 5 min</option>
          <option value="600">Rows: 10 min</option>
          <option value="900">Rows: 15 min</option>
          <option value="1200">Rows: 20 min</option>
          <option value="1800">Rows: 30 min</option>
          <option value="3600" selected>Rows: 1 hour</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button id="tag-as-btn" class="primary" title="Tag the selected photos at a place you already use — saved places, recent locations, hotspots (shortcut: L)">📍 Tag as… <kbd>L</kbd></button>
      </div>
      <div class="toolbar-group">
        <!-- Stages, like a map drop — nothing is written until Commit. Undoing a
             committed mark is the detail pane's "Ignore for geocoding" checkbox. -->
        <button id="mark-ignored-btn" title="Stage the selected photos as not needing a location (e.g. screenshots) — review and Commit below">🚫 Ignore location</button>
      </div>
    </div>

    <!-- Proposal banner: where the selection's photos were probably taken, based
         on their nearest-in-time geotagged neighbours. Staging from here never
         touches the map. -->
    <div id="propose-bar" style="display:none">
      <span id="propose-summary"></span>
      <div id="propose-actions"></div>
      <button id="propose-dismiss" title="Hide this suggestion">✕</button>
    </div>
    </div>

    <div id="grid"></div>

    <!-- Staging area: photos dropped on the map are reverse-geocoded and parked
         here, grouped by the resolved location, until committed or reverted. -->
    <div id="pending-pane" style="display:none">
      <div id="pending-groups"></div>
      <div id="pending-bar">
        <span id="pending-summary"></span>
        <div id="pending-bar-btns">
          <button id="commit-all-btn" class="primary" title="Write every staged location to the photos">✔ Commit all</button>
          <button id="revert-all-btn" class="danger" title="Throw away every staged location and put the photos back in the grid">↩ Revert all</button>
        </div>
      </div>
    </div>
  </div>
  <div id="detail-pane">
    <div id="detail-placeholder">Select a photo to view details</div>
    <div id="detail-content" style="display:none">
      <img id="detail-img" src="" alt="Preview"/>
      <div id="detail-actions">
        <button id="photo-faces-btn" title="View and edit every detected face in this photo">👥 Faces</button>
        <button id="view-fullsize-btn" title="Decode the RAW at full resolution and open it (with face boxes) in a new tab" style="display:none">🔍 View full size (RAW)</button>
      </div>
      <table id="detail-meta"></table>
      <div id="guess-bar" style="display:none">
        <button id="guess-btn">Guess location</button>
        <div id="guess-result" style="display:none">
          <span id="guess-summary"></span>
          <div class="guess-actions">
            <button id="guess-apply-btn" class="primary">Apply</button>
            <button id="guess-dismiss-btn">Dismiss</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<!-- Month Picker Modal -->
<div id="month-picker-modal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="modal-close">&times;</span>
    <h2>Select Month</h2>
    <div id="month-picker-list"></div>
  </div>
</div>

<!-- Timeline Modal: the histogram + range handles used to sit permanently under
     the toolbar; it costs 72px of vertical space to answer a question you ask
     once per month, so it lives here now and the toolbar shows the range. -->
<div id="timeline-modal" class="modal" style="display:none">
  <div class="modal-content" id="timeline-modal-content">
    <span class="modal-close" id="timeline-modal-close">&times;</span>
    <h2>Date range</h2>
    <div id="timeline">
      <canvas id="hist-canvas"></canvas>
      <input id="range-lo" class="hist-range" type="range" min="0" max="1000" value="0"/>
      <input id="range-hi" class="hist-range" type="range" min="0" max="1000" value="1000"/>
      <div id="hist-labels">
        <span id="hist-label-lo"></span>
        <span id="hist-label-hi"></span>
      </div>
    </div>
    <div id="timeline-modal-actions">
      <button id="timeline-reset-btn" title="Widen the range back to every photo loaded">↩ Reset range</button>
      <button id="timeline-done-btn" class="primary">Done</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="face-grid.js"></script>
<script src="photo-fullsize.js"></script>
<script src="nav.js"></script>
<script src="location-picker.js"></script>
<script src="app.js"></script>
<script src="workspace-layout.js"></script>
<!-- After app.js: Road Trip mode reads its globals (map, photos, stageDrop …)
     and registers its own DOMContentLoaded handler, which must run second. -->
<script src="roadtrip.js"></script>
</body>
</html>
