<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="face-grid.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="geocode"></div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <button id="select-month-btn">Select Month</button>
    <span id="selected-month-label">No month selected</span>
  </div>
  <div class="toolbar-group">
    <button id="select-area-btn">Select Area</button>
    <select id="window-select">
      <option value="900">Window: 15 min</option>
      <option value="1800">Window: 30 min</option>
      <option value="3600">Window: 1 hr</option>
      <option value="7200">Window: 2 hr</option>
      <option value="43200">Window: 12 hr</option>
      <option value="86400">Window: 24 hr</option>
      <option value="604800">Window: 1 week</option>
    </select>
    <span id="selected-area-label"></span>
  </div>
</div>

<!-- Hidden controls kept for JS compatibility -->
<div style="display:none">
  <select id="context-filter-select"><option value="">-- none --</option></select>
  <span id="selected-context-label"></span>
  <input id="lat-input" type="text"/>
  <input id="lng-input" type="text"/>
  <button id="apply-latlng-btn"></button>
  <button id="copy-location-btn"></button>
  <button id="remove-geotag-btn"></button>
</div>

<div id="cam-legend"></div>

<div id="timeline">
  <canvas id="hist-canvas"></canvas>
  <input id="range-lo" class="hist-range" type="range" min="0" max="1000" value="0"/>
  <input id="range-hi" class="hist-range" type="range" min="0" max="1000" value="1000"/>
  <div id="hist-labels">
    <span id="hist-label-lo"></span>
    <span id="hist-label-hi"></span>
  </div>
</div>

<div id="main">
  <div id="map-pane">
    <div id="map-nav">
      <div class="toolbar-group">
        <label>Places:</label>
        <select id="places-select">
          <option value="">Select a place...</option>
        </select>
        <button id="draw-rectangle-btn" title="Draw Rectangle">📐</button>
        <button id="draw-circle-btn" title="Draw Circle">⭕</button>
      </div>
      <div class="toolbar-group imprecise-control-group">
        <label title="Drop photos with a specified uncertainty radius">
          <input type="checkbox" id="imprecise-toggle" />
          Imprecise Drop
        </label>
        <select id="imprecise-radius-select" style="display: none;">
          <option value="160.934">0.1 miles</option>
          <option value="402.336">0.25 miles</option>
          <option value="804.672">0.5 miles</option>
          <option value="1609.34">1 mile</option>
          <option value="8046.72">5 miles</option>
          <option value="16093.44">10 miles</option>
          <option value="40233.6" selected>25 miles</option>
          <option value="80467.2">50 miles</option>
        </select>
      </div>
      <div class="toolbar-group">
        <input id="place-search" type="text" placeholder="Search place…" />
        <button id="place-search-btn">Go</button>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <div id="grid-pane">
    <div id="grid-nav">
      <div class="toolbar-group">
        <label>Show:</label>
        <select id="filter-select">
          <option value="all">All</option>
          <option value="yes">Geotagged</option>
          <option value="no">Not geotagged</option>
          <option value="mixed">Mixed geotagged days</option>
        </select>
      </div>
      <div class="toolbar-group imprecise-control-group">
        <label>
          <input type="checkbox" id="include-screenshots-chk" checked/>
          Screenshots
        </label>
      </div>
      <div class="toolbar-group">
        <button id="mark-ignored-btn" title="Mark selected photos as not needing a location (e.g. screenshots)">🚫 Ignore location</button>
        <button id="unmark-ignored-btn" title="Restore selected photos to normal geocoding filtering">↩ Un-ignore</button>
      </div>
    </div>
    <div id="grid"></div>
  </div>
  <div id="detail-pane">
    <div id="detail-placeholder">Select a photo to view details</div>
    <div id="detail-content" style="display:none">
      <img id="detail-img" src="" alt="Preview"/>
      <table id="detail-meta"></table>
      <div id="guess-bar" style="display:none">
        <button id="guess-btn">Guess location</button>
        <div id="guess-result" style="display:none">
          <span id="guess-summary"></span>
          <div class="guess-actions">
            <button id="guess-apply-btn" class="primary">Apply</button>
            <button id="guess-dismiss-btn">Dismiss</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<!-- Month Picker Modal -->
<div id="month-picker-modal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="modal-close">&times;</span>
    <h2>Select Month</h2>
    <div id="month-picker-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="face-grid.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
</body>
</html>
