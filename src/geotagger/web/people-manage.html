<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People Manager – Geo-Tagger</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="people-manage.css"/>
</head>
<body>
<header id="manage-bar">
  <a href="/people.html" id="back-link">‹ People</a>
  <span id="manage-title">People Manager</span>
  <span id="manage-counts"></span>
</header>

<div id="manage-main">
  <!-- Families section -->
  <section id="families-section">
    <div id="families-header">
      <span class="section-label">Families</span>
      <button id="add-family-btn">+ Add Family</button>
    </div>
    <div id="family-chips">
      <span class="no-families-hint">No families yet — add one to group people.</span>
    </div>
  </section>

  <!-- Person list -->
  <section id="persons-section">
    <div id="persons-toolbar">
      <input id="person-search" type="text" placeholder="Search people…" autocomplete="off"/>
      <select id="family-filter-sel">
        <option value="">All families</option>
        <option value="__none__">No family</option>
      </select>
      <span id="persons-count"></span>
      <button id="add-person-btn">+ Add Person</button>
    </div>
    <div id="persons-table-wrap">
      <table id="persons-table">
        <thead>
          <tr>
            <th class="col-name">Name</th>
            <th class="col-birth">Birth Date</th>
            <th class="col-not-before">Not Before</th>
            <th class="col-not-after">Not After</th>
            <th class="col-family">Family</th>
            <th class="col-faces">Faces</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="persons-body"></tbody>
      </table>
      <div id="no-persons" hidden>No people match the filter.</div>
    </div>
  </section>
</div>

<!-- Add-person dialog (simple inline prompt via JS) -->
<div id="toast" hidden></div>

<script src="common.js"></script>
<script src="people-manage.js"></script>
</body>
</html>
