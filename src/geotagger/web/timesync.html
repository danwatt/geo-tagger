<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Sync - Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="timesync.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="timesync"></div>
  <div class="toolbar-group">
    <button id="select-month-btn">Select Month</button>
    <span id="selected-month-label">No month selected</span>
  </div>
  <div class="toolbar-group">
    <label>Show:</label>
    <select id="filter-select">
      <option value="all">All</option>
      <option value="yes">Geotagged</option>
      <option value="no">Not geotagged</option>
    </select>
  </div>
  <div class="toolbar-group">
    <label>Time offset:</label>
    <input id="offset-minutes" type="number" placeholder="Min" style="width:60px" value="0"/>
    <input id="offset-seconds" type="number" placeholder="Sec" style="width:60px" value="0"/>
    <button id="apply-offset-btn">Apply to selection</button>
    <button id="reset-offset-btn">Reset</button>
  </div>
  <div class="toolbar-group">
    <button id="save-times-btn" class="primary">Save times to sidecar</button>
  </div>
</div>

<div id="cam-legend"></div>

<div id="timeline-pane">
  <canvas id="hist-canvas"></canvas>
  <input id="range-lo" class="hist-range" type="range" min="0" max="1000" value="0"/>
  <input id="range-hi" class="hist-range" type="range" min="0" max="1000" value="1000"/>
  <div id="hist-labels">
    <span id="hist-label-lo"></span>
    <span id="hist-label-hi"></span>
  </div>
</div>

<div id="timeline-container"></div>

<div id="bottom-section">
  <div id="grid-pane">
    <div id="grid"></div>
  </div>
  <div id="detail-pane">
    <div id="detail-placeholder">Select a photo to view details</div>
    <div id="detail-content" style="display:none">
      <img id="detail-img" src="" alt="Preview"/>
      <button id="view-fullsize-btn" title="Decode the RAW at full resolution and open it in a new tab" style="display:none">🔍 View full size (RAW)</button>
      <table id="detail-meta"></table>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<!-- Month Picker Modal -->
<div id="month-picker-modal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="modal-close">&times;</span>
    <h2>Select Month</h2>
    <div id="month-picker-list"></div>
  </div>
</div>

<script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
<script src="photo-fullsize.js"></script>
<script src="nav.js"></script>
<script src="timesync.js"></script>
</body>
</html>
