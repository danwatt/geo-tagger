<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Faces - Geo-Tagger</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="photo-faces.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group">
    <button id="back-btn">← Back</button>
  </div>
  <div class="toolbar-group" id="nav-group">
    <button id="prev-btn" disabled>← Prev</button>
    <span id="photo-counter" class="toolbar-label">—</span>
    <button id="next-btn" disabled>Next →</button>
  </div>
  <div class="toolbar-group">
    <span id="photo-filename" class="toolbar-label filename-label"></span>
    <button id="view-fullsize-btn" title="Decode the RAW at full resolution and open it (with face boxes) in a new tab" style="display:none">🔍 View full size (RAW)</button>
  </div>
  <div class="toolbar-group">
    <button id="add-face-btn" title="Draw a box around a face detection missed, then pick who it is">➕ Add face</button>
    <button id="rescan-faces-btn" class="danger" title="Wipe every face for this photo (including tagged ones) and re-run detection from scratch">🔄 Rescan faces</button>
    <button id="ignore-unlabeled-btn" class="danger" disabled>Ignore unlabeled (—)</button>
    <button id="done-next-btn" class="primary" disabled>Done &amp; next →</button>
  </div>
  <div class="toolbar-group" id="skip-group">
    <label title="Prev/Next skip photos where all faces are labeled or ignored">
      <input type="checkbox" id="hide-done-chk" checked/> Skip completed
    </label>
  </div>
</div>

<div id="cr-main">
  <!-- Left: face review sections (scrollable) -->
  <div id="cr-faces">
    <div id="section-tagged"></div>
    <div id="section-suggested"></div>
    <div id="section-unknown"></div>
    <div id="section-comeback"></div>
    <div id="section-ignored"></div>
    <div id="cr-empty" style="display:none">No faces found for this photo.</div>
  </div>

  <!-- Right: full photo with bbox overlay -->
  <div id="cr-photo-pane">
    <div id="photo-container">
      <img id="photo-full" src="" alt="Photo"/>
      <div id="bbox-overlay"></div>
    </div>
    <table id="photo-meta"></table>
  </div>
</div>

<div id="status-bar"></div>
<script src="common.js"></script>
<script src="face-grid.js"></script>
<script src="photo-fullsize.js"></script>
<script src="photo-faces.js"></script>
</body>
</html>
