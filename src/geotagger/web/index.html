<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo-Tagger</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="home.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="home"></div>
</div>

<div id="dashboard">
  <div class="card card-full" id="card-geotag">
    <h2>Geotagging</h2>
    <div class="progress-bar"><div class="progress-fill" id="geotag-progress-fill"></div></div>
    <div class="progress-label" id="geotag-progress-label"></div>
    <div class="stat-line" id="geotag-stats"></div>
    <div class="stat-line highlight" id="geotag-guessable"></div>

    <div id="work-queue">
      <div class="wq-header">
        <span class="wq-label">Work queue</span>
        <span class="wq-totals" id="wq-totals"></span>
        <div class="wq-kinds" id="wq-kinds">
          <button class="active" data-kind="all">All</button>
          <button data-kind="session">Sessions</button>
          <button data-kind="folder">Folders</button>
        </div>
      </div>
      <div id="wq-list"></div>
      <div class="wq-footer">
        <button id="wq-more" style="display:none">Show more</button>
        <button id="wq-clear-skipped" style="display:none"
                title="Batches passed over with Skip are hidden from Next batch until this is cleared"></button>
      </div>
    </div>

    <div class="card-actions">
      <a class="button" href="/geocode.html">📍 Open Geocode view</a>
    </div>
  </div>

  <div class="card" id="card-library">
    <h2>Library</h2>
    <div class="big-number" id="library-total">—</div>
    <div class="sub-line" id="library-breakdown"></div>
  </div>

  <div class="card" id="card-reverse-geocode">
    <h2>Reverse geocoding (place names)</h2>
    <div class="stat-line" id="reverse-geocode-stats"></div>
    <div class="hint" id="reverse-geocode-hint" style="display:none"></div>
    <div class="card-actions">
      <button id="backfill-btn">Run backfill</button>
    </div>
    <div class="stat-line" id="export-sidecars-stats"></div>
    <div class="hint" id="export-sidecars-result" style="display:none"></div>
    <div class="card-actions">
      <button id="export-sidecars-btn" title="Write each geotagged photo's GPS and place names into its XMP sidecar (originals are never modified)">Export to sidecars</button>
    </div>
  </div>

  <div class="card" id="card-faces">
    <h2>Faces</h2>
    <div class="progress-bar"><div class="progress-fill" id="faces-progress-fill"></div></div>
    <div class="progress-label" id="faces-progress-label"></div>
    <div class="stat-line" id="faces-unscanned"></div>
    <div class="hint" id="faces-failed" style="display:none"></div>
    <div class="card-actions">
      <button id="detect-faces-btn">Detect faces</button>
      <button id="detect-faces-stop-btn" class="danger" style="display:none">Stop</button>
      <button id="faces-retry-failed-btn" style="display:none">Retry failed</button>
    </div>
    <div class="card-actions">
      <a class="button" href="/people.html">🙂 People</a>
      <a class="button" href="/tag.html">📱 Quick Tag</a>
    </div>
    <div class="stat-line" id="dedup-stats"></div>
    <div class="card-actions">
      <button id="dedup-recompute-btn">Recompute representative faces</button>
    </div>
  </div>

  <div class="card" id="card-face-coverage">
    <h2>Face coverage</h2>
    <div class="coverage-bar" id="face-coverage-bar"></div>
    <div class="progress-label" id="face-coverage-label"></div>
    <div class="coverage-legend" id="face-coverage-legend"></div>
  </div>

  <div class="card" id="card-people">
    <h2>People</h2>
    <div class="stat-line" id="people-stats"></div>
    <div class="card-actions">
      <a class="button" href="/people-manage.html">⚙ Manage</a>
    </div>
  </div>

  <div class="card card-full" id="card-months">
    <div class="card-header-row">
      <h2>Coverage by month</h2>
      <div class="mode-toggle" id="months-mode-toggle" data-mode="pct">
        <button type="button" data-mode="pct" class="active">%</button>
        <button type="button" data-mode="abs">Count</button>
      </div>
    </div>
    <div id="months-bar-container" class="months-bar-container"></div>
    <a id="months-undated-link" class="undated-link" style="display:none"></a>
  </div>

  <div class="card card-full" id="card-faces-months">
    <div class="card-header-row">
      <h2>Face coverage by month</h2>
      <div class="mode-toggle" id="faces-months-mode-toggle" data-mode="pct">
        <button type="button" data-mode="pct" class="active">%</button>
        <button type="button" data-mode="abs">Count</button>
      </div>
    </div>
    <div id="faces-months-bar-container" class="months-bar-container"></div>
    <a id="faces-months-undated-link" class="undated-link" style="display:none"></a>
  </div>
</div>

<script src="common.js"></script>
<script src="nav.js"></script>
<script src="home.js"></script>
</body>
</html>
