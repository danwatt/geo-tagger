<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Representative Faces - Geo-Tagger</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="representatives.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="representatives"></div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <button id="recompute-btn">Recompute representatives</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>People</h2>
    </div>
    <div id="person-list">
      <div id="no-persons-hint">
        No one has representative faces yet — click “Recompute representatives” above
        (only applies to people with enough labeled faces; see Settings).
      </div>
    </div>
  </div>

  <div id="groups-pane">
    <div id="groups-empty">Pick a person on the left to review their representative groups.</div>
    <div id="groups-grid"></div>
  </div>
</div>

<div id="status-bar"></div>
<script src="common.js"></script>
<script src="face-grid.js"></script>
<script src="nav.js"></script>
<script src="representatives.js"></script>
</body>
</html>
