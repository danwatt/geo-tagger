<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Places - Geo-Tagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="custom-places.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="custom-places"></div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <button id="draw-rectangle-btn" title="Draw Rectangle">📐 Rectangle</button>
    <button id="draw-circle-btn" title="Draw Circle">⭕ Circle</button>
  </div>
  <div class="toolbar-group">
    <label title="Show the recurring spots mined from your already-geotagged photos, so you can name the ones worth keeping">
      <input type="checkbox" id="show-hotspots-chk"/>
      🔥 Hotspots
    </label>
    <span id="hotspot-controls" style="display:none">
      <select id="hotspot-sort" title="How to rank the hotspots">
        <option value="count">Most tagged</option>
        <option value="recent">Most recent</option>
      </select>
      <label title="Limit the list to hotspots inside the map's current view, and follow it as you pan">
        <input type="checkbox" id="hotspot-in-view-chk"/>
        Only in view
      </label>
    </span>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Custom Places</h2>
      <span id="place-count"></span>
      <!-- Compact drops the big representative thumbnail to a 46px one, so a
           long list is scannable instead of two cards to a screen. -->
      <button id="place-density-btn" class="icon-btn" title="Switch between compact and gallery rows">▤</button>
    </div>
    <!-- Proactive nudge: the busiest unnamed hotspot, shown without asking the
         user to flip on the Hotspots overlay first. Hidden until a candidate
         clears the minimum photo count (see SUGGEST_MIN_COUNT in custom-places.js). -->
    <div id="suggest-place-banner" class="hotspot-item" style="display:none">
      <div class="hotspot-body">
        <div class="hotspot-label" id="suggest-place-label"></div>
        <div class="hotspot-meta" id="suggest-place-meta"></div>
        <div class="hotspot-actions">
          <button id="suggest-place-zoom-btn">Zoom</button>
          <button id="suggest-place-name-btn" class="name-btn primary">✏️ Name it…</button>
          <button id="suggest-place-dismiss-btn">Dismiss</button>
        </div>
      </div>
    </div>

    <!-- These narrow the sidebar list only; every place stays drawn on the map. -->
    <div id="place-controls">
      <input type="search" id="place-search" placeholder="Search places…" autocomplete="off"/>
      <div id="place-controls-row">
        <select id="place-sort" title="How to order the list">
          <option value="name">A–Z</option>
          <option value="count">Most photos</option>
          <option value="recent">Most recent photo</option>
          <option value="created">Newest place</option>
        </select>
        <select id="place-filter" title="Which places to list">
          <option value="all">All</option>
          <option value="with-photo">With photo</option>
          <option value="without-photo">No photo</option>
        </select>
      </div>
    </div>
    <div id="place-list">
      <div id="no-places-hint">No places yet — draw a rectangle or circle on the map.</div>
    </div>

    <!-- Hotspots: unnamed spots mined from the photos' own coordinates. Naming
         one turns it into a place above, at which point it drops off this list. -->
    <div id="hotspot-section" style="display:none">
      <div id="hotspot-header">
        <h3>Hotspots</h3>
        <span id="hotspot-count"></span>
      </div>
      <div id="hotspot-list"></div>
    </div>
  </div>
  <div id="map"></div>
</div>

<div id="status-bar"></div>

<!-- Name/rename dialog. Replaces window.prompt so a place can be named and sized
     in one step, and so a clashing name can be pointed out while you type. -->
<div id="place-dialog" class="modal" style="display:none">
  <div class="modal-content" id="place-dialog-content">
    <h2 id="place-dialog-title">Name this place</h2>
    <label class="dialog-field">
      <span>Name</span>
      <input type="text" id="place-dialog-name" autocomplete="off" maxlength="200"/>
    </label>
    <div id="place-dialog-dupe" class="dialog-note" hidden></div>
    <label class="dialog-field" id="place-dialog-radius-field">
      <span>Radius (metres)</span>
      <input type="number" id="place-dialog-radius" min="2" step="1"/>
    </label>
    <div id="place-dialog-hint" class="dialog-note"></div>
    <div class="dialog-actions">
      <button id="place-dialog-cancel">Cancel</button>
      <button id="place-dialog-save" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- Confirm dialog, for deletes. Same shell as above so an irreversible action
     doesn't look like a different app than the one that created the place. -->
<div id="confirm-dialog" class="modal" style="display:none">
  <div class="modal-content" id="confirm-dialog-content">
    <h2 id="confirm-dialog-title">Are you sure?</h2>
    <div id="confirm-dialog-body" class="dialog-note"></div>
    <div class="dialog-actions">
      <button id="confirm-dialog-cancel">Cancel</button>
      <button id="confirm-dialog-ok" class="danger">Delete</button>
    </div>
  </div>
</div>

<!-- Representative photo picker: the photos actually taken inside the place,
     so choosing the one that best shows it is a matter of looking. -->
<div id="rep-picker-modal" class="modal" style="display:none">
  <div class="modal-content" id="rep-picker-content">
    <span class="modal-close" id="rep-picker-close">&times;</span>
    <h2 id="rep-picker-title">Representative photo</h2>
    <div id="rep-picker-grid"></div>
    <div id="rep-picker-actions">
      <button id="rep-picker-clear" class="danger" title="Leave this place without a representative photo">Clear photo</button>
      <button id="rep-picker-done" class="primary">Done</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="nav.js"></script>
<script src="custom-places.js"></script>
</body>
</html>
