<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quick Tag</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="tag.css"/>
</head>
<body>
<div id="app">
  <header id="bar">
    <a id="back" href="/people.html" title="Full People view">‹</a>
    <span id="title">Quick Tag</span>
    <span id="progress"></span>
    <button id="settings-btn" aria-label="Settings">⚙</button>
  </header>
  <div id="settings-panel" hidden>
    <label class="ctl">
      <span class="ctl-label">Strictness</span>
      <input type="range" id="threshold-slider" min="0.3" max="0.95" step="0.05">
      <span id="threshold-val" class="ctl-val"></span>
    </label>
    <label class="ctl">
      <span class="ctl-label">Date window</span>
      <select id="window-select">
        <option value="7">1 week</option>
        <option value="14">2 weeks</option>
        <option value="30">1 month</option>
        <option value="60">2 months</option>
        <option value="90">3 months</option>
      </select>
    </label>
  </div>

  <main id="stage">
    <div id="loading" class="msg">Finding groups…</div>
    <div id="done" class="msg" hidden></div>
    <section id="card" hidden>
      <div id="card-head">
        <div id="hint" title="Tap to choose or rename"></div>
        <div id="meta"></div>
        <div id="place"></div>
        <div id="card-actions">
          <button id="choose-btn" class="link-btn">👤 Choose person…</button>
          <button id="prev-btn" class="link-btn" hidden>↩ Use previous<span id="prev-name"></span></button>
        </div>
      </div>
      <div id="faces"></div>
    </section>
  </main>

  <footer id="actions" hidden>
    <button id="ignore-btn" class="act danger">🚫 Ignore</button>
    <button id="skip-btn" class="act">Skip ›</button>
    <button id="accept-btn" class="act primary">✓ Accept</button>
  </footer>
</div>

<!-- Full-photo preview with the face boxed; tap anywhere to close -->
<div id="overlay" hidden>
  <div id="overlay-inner">
    <img id="overlay-img" alt="">
    <div id="overlay-box"></div>
  </div>
  <button id="overlay-fullsize-btn" title="View full size (RAW)" style="display:none">🔍 View full size (RAW)</button>
  <div id="overlay-hint">tap to close</div>
</div>

<!-- Person picker (existing people + create new) -->
<div id="picker" hidden>
  <div id="picker-sheet">
    <div id="picker-head">
      <span id="picker-title">Assign to…</span>
      <button id="picker-close" aria-label="Close">✕</button>
    </div>
    <input id="picker-search" type="text" autocomplete="off" autocapitalize="words"
           placeholder="Search people, or type a new name…"/>
    <div id="picker-list"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="common.js"></script>
<script src="face-grid.js"></script>
<script src="photo-fullsize.js"></script>
<script src="tag.js"></script>
</body>
</html>
