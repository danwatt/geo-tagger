<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Geocode</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="quick-geocode.css"/>
</head>
<body>
<div id="app">
  <header id="bar">
    <a id="back" href="/" title="Home">‹</a>
    <span id="title">Quick Geocode</span>
    <span id="progress"></span>
    <button id="settings-btn" aria-label="Settings">⚙</button>
  </header>
  <div id="settings-panel" hidden>
    </div>

  <main id="stage">
    <div id="map-container">
        <div id="map-controls">
            <div class="imprecise-control-group">
                <label title="Drop photos with a specified uncertainty radius">
                <input type="checkbox" id="imprecise-toggle" />
                Imprecise Drop
                </label>
                <select id="imprecise-radius-select" style="display: none;">
                <option value="160.934">0.1 miles</option>
                <option value="402.336">0.25 miles</option>
                <option value="804.672">0.5 miles</option>
                <option value="1609.34">1 mile</option>
                <option value="8046.72">5 miles</option>
                <option value="16093.44">10 miles</option>
                <option value="40233.6" selected>25 miles</option>
                <option value="80467.2">50 miles</option>
                </select>
            </div>
        </div>
        <div id="map"></div>
    </div>
    <div id="photo-container">
        <div id="grid-before-section" class="face-group-section"></div>
        <div id="grid-to-tag-section" class="face-group-section"></div>
        <div id="grid-after-section" class="face-group-section"></div>
    </div>
  </main>

  <footer id="actions">
    <button id="skip-btn" class="act">Skip ›</button>
    <button id="save-btn" class="act primary">✓ Save Location</button>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="face-grid.js"></script>
<script src="quick-geocode.js"></script>
</body>
</html>
