<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - Geo-Tagger</title>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="face-grid.css"/>
<link rel="stylesheet" href="search.css"/>
<link rel="stylesheet" href="location-picker.css"/>
<link rel="stylesheet" href="date-range-picker.css"/>
<link rel="stylesheet" href="workspace-layout.css"/>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-group" id="app-nav" data-active="search"></div>
</div>

<div id="search-form">
  <div class="search-field search-field-text">
    <label for="text-input">Describe</label>
    <input type="search" id="text-input" placeholder="Describe the photo… e.g. sunset over a bridge" autocomplete="off"
      maxlength="300" aria-describedby="text-help"/>
    <span id="text-help">Ranks results by what's in the picture. Combines with the filters.</span>
  </div>
  <div class="search-field search-field-location">
    <label for="location-input">Location</label>
    <input type="text" id="location-input" placeholder="Search saved places, cities, counties…" autocomplete="off"
      role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="location-suggest" aria-describedby="location-help"/>
    <div id="location-suggest" class="location-suggestions" role="listbox" hidden></div>
    <span id="location-help">Choose a place or search photo location text.</span>
  </div>
  <div class="search-field" id="nearby-field" hidden>
    <label for="nearby-select">Search area</label>
    <select id="nearby-select" title="Grow the place's bounds outward before filtering photos">
      <option value="0">Within bounds</option>
      <option value="0.1">+0.1 miles</option>
      <option value="0.25">+0.25 miles</option>
      <option value="0.5">+0.5 miles</option>
      <option value="1">+1 mile</option>
      <option value="2">+2 miles</option>
      <option value="5">+5 miles</option>
      <option value="10">+10 miles</option>
    </select>
  </div>
  <div class="search-field search-field-dates">
    <label id="date-range-label">Date range</label>
    <div id="date-range" aria-labelledby="date-range-label"></div>
    <label class="checkbox-label" id="undated-only-label">
      <input type="checkbox" id="undated-only-checkbox"/> Undated only
    </label>
  </div>
  <div class="search-field">
    <label for="geotagged-select">Geotagged</label>
    <select id="geotagged-select">
      <option value="all">Any</option>
      <option value="yes">Geotagged only</option>
      <option value="no">Not geotagged</option>
    </select>
  </div>
  <div class="search-field">
    <label for="camera-select">Camera</label>
    <select id="camera-select">
      <option value="">Any</option>
    </select>
  </div>
  <div class="search-field">
    <label for="folder-select">Folder</label>
    <select id="folder-select">
      <option value="">Any</option>
    </select>
  </div>
  <div class="search-field">
    <label for="gps-accuracy-select">GPS accuracy</label>
    <select id="gps-accuracy-select">
      <option value="all">Any</option>
      <option value="precise">Precise only</option>
      <option value="imprecise">Imprecise (radius) only</option>
    </select>
  </div>
  <div class="search-field">
    <label for="has-faces-select">Faces</label>
    <select id="has-faces-select">
      <option value="all">Any</option>
      <option value="yes">Has faces</option>
      <option value="no">No faces detected</option>
    </select>
  </div>
  <div class="search-field">
    <label for="sort-select">Sort</label>
    <select id="sort-select">
      <option value="relevance">Best match</option>
      <option value="date_asc">Date (oldest first)</option>
      <option value="date_desc">Date (newest first)</option>
      <option value="filename">Filename</option>
      <option value="camera">Camera</option>
    </select>
  </div>
  <div class="search-field search-field-people">
    <label for="person-picker-input">People</label>
    <div id="person-chips"></div>
    <input type="text" id="person-picker-input" placeholder="Add a person…" autocomplete="off"/>
    <div id="person-suggest" style="display:none"></div>
  </div>
  <div class="search-field search-field-mode" id="person-mode-field" style="display:none">
    <label for="person-mode-select">Match</label>
    <select id="person-mode-select" title="'Together' requires every selected person to appear in the same photo">
      <option value="all">Together (same photo)</option>
      <option value="any">Any of them</option>
    </select>
  </div>
  <div class="search-field search-field-untagged" id="untagged-field" style="display:none">
    <label>&nbsp;</label>
    <button id="untagged-btn">🔎 Find untagged faces</button>
  </div>
  <div class="search-field search-field-actions">
    <button id="search-btn" class="primary">🔎 Search</button>
    <button id="clear-btn">Clear</button>
  </div>
</div>

<div class="workspace-scope"><span id="workspace-scope-text">Choose filters to find photos</span><button id="preview-toggle" aria-expanded="true">Hide preview</button></div>

<div id="timeline" style="display:none">
  <canvas id="hist-canvas"></canvas>
  <input id="range-lo" class="hist-range" type="range" min="0" max="1000" value="0"/>
  <input id="range-hi" class="hist-range" type="range" min="0" max="1000" value="1000"/>
  <div id="hist-labels">
    <span id="hist-label-lo"></span>
    <span id="hist-label-hi"></span>
  </div>
</div>

<div id="main">
  <div id="grid-pane">
    <div id="grid-nav">
      <div class="toolbar-group">
        <span id="search-summary"></span>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-group" id="handoff-group" style="display:none">
        <button id="select-all-btn" title="Select every photo in the current results">☑ Select all</button>
        <button id="open-geocode-btn" title="Open these results in Geocode for location tagging">📍 Open in Geocode</button>
        <button id="open-people-btn" title="Open this person in People" style="display:none">🙂 Open in People</button>
      </div>
      <div class="toolbar-group" id="selection-group" style="display:none">
        <span id="selection-count"></span>
        <button id="assign-date-btn" title="Assign an approximate (year or month) date to the selected photos">📅 Assign date…</button>
        <button id="guess-dates-btn" title="Guess dates from filenames (YYYYMMDD) or folder names (YYYY or YYYY-MM)">🔍 Guess dates…</button>
        <button id="download-selected-btn" class="primary">⬇ Download ZIP</button>
        <button id="clear-selection-btn">Clear selection</button>
      </div>
      <div class="toolbar-group" id="date-undo-group" style="display:none">
        <span id="date-undo-count"></span>
        <button id="date-undo-btn">↩ Undo</button>
      </div>
    </div>
    <div id="grid"></div>
  </div>
  <div id="detail-pane">
    <div id="detail-placeholder">Select a photo to view details</div>
    <div id="detail-content" style="display:none">
      <img id="detail-img" src="" alt="Preview"/>
      <div id="detail-actions" style="display:none">
        <button id="view-fullsize-btn" title="Decode the RAW at full resolution and open it (with face boxes) in a new tab">🔍 View full size (RAW)</button>
      </div>
      <div id="detail-similar">
        <button id="similar-btn" title="Find visually similar photos (uses the text search index)">More like this</button>
      </div>
      <table id="detail-meta"></table>
    </div>
  </div>
</div>

<div id="assign-date-modal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="modal-close" id="assign-date-close">&times;</span>
    <h2>Assign approximate date</h2>
    <p id="assign-date-summary" style="color:#aaa; margin-bottom:16px"></p>
    <div class="search-field">
      <label for="assign-date-year">Year</label>
      <input type="number" id="assign-date-year" min="1826" step="1"/>
    </div>
    <div class="search-field">
      <label for="assign-date-month">Month (optional — leave blank for year-only precision)</label>
      <select id="assign-date-month">
        <option value="">— Year only —</option>
        <option value="1">January</option><option value="2">February</option>
        <option value="3">March</option><option value="4">April</option>
        <option value="5">May</option><option value="6">June</option>
        <option value="7">July</option><option value="8">August</option>
        <option value="9">September</option><option value="10">October</option>
        <option value="11">November</option><option value="12">December</option>
      </select>
    </div>
    <div class="search-field search-field-actions">
      <button id="assign-date-apply-btn" class="primary">Assign</button>
      <button id="assign-date-cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<div id="guess-dates-modal" class="modal" style="display:none">
  <div class="modal-content" style="max-width:700px">
    <span class="modal-close" id="guess-dates-close">&times;</span>
    <h2>Guess dates from filename/folder</h2>
    <p id="guess-dates-summary" style="color:#aaa; margin-bottom:12px"></p>
    <div id="guess-dates-table-wrap" style="max-height:50vh; overflow-y:auto">
      <table id="guess-dates-table">
        <thead><tr><th></th><th>Filename</th><th>Guessed date</th><th>Source</th></tr></thead>
        <tbody id="guess-dates-tbody"></tbody>
      </table>
    </div>
    <div class="search-field search-field-actions" style="margin-top:14px">
      <button id="guess-dates-commit-btn" class="primary">Commit</button>
      <button id="guess-dates-cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<script src="face-grid.js"></script>
<script src="photo-fullsize.js"></script>
<script src="nav.js"></script>
<script src="location-picker.js"></script>
<script src="date-range-picker.js"></script>
<script src="search.js"></script>
<script src="workspace-layout.js"></script>
</body>
</html>
