[project]
name = "vision-bench"
version = "0.0.1"
description = "Isolated prototype: benchmark local image-embedding (CLIP family) and captioning (VLM) models for geotagger semantic search."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57,<5",
    "accelerate>=1.10",
    "open_clip_torch>=3.2",
    "timm>=1.0.19",
    "sentence-transformers>=5.1",
    "einops",
    "bitsandbytes>=0.47",
    "pillow",
    "numpy",
    "psutil",
    "qwen-vl-utils",
    "num2words",
    "rawpy>=0.28.0",
    "pillow-heif>=1.8.1",
    "hf-xet>=1.8.0",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.22.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
